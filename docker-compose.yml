version: '3.8'

services:
  age-postgres:
    image: apache/age:latest
    container_name: age-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5455:5432"
    volumes:
      - age_data:/var/lib/postgresql/data

volumes:
  age_data:
